<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی‌های آموزشی فارسی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f1ff;--card:#fff;--ink:#1d3557;--gr:#9be29b;--g:#2f9e44;--y:#ffd23f;--r:#e63946;--b:#2563eb;--p:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16223d;--card:#243459;--ink:#f3f6ff;--gr:#2f6b3a}}
:root[data-theme=dark]{--bg:#16223d;--card:#243459;--ink:#f3f6ff;--gr:#2f6b3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.7}
.hd{text-align:center;padding:12px 8px 0;background:linear-gradient(#5db8ff,var(--bg));position:relative}
.hd h1{margin:0;font-size:1.5rem;font-weight:900;color:#fff;text-shadow:0 2px 0 #1d3557}
.sun{position:absolute;top:6px;inset-inline-start:12px;font-size:2rem}
.sc{font-size:2rem;background:var(--gr);border-radius:50% 50% 0 0/36px 36px 0 0;padding:8px 0 0;letter-spacing:.5rem;white-space:nowrap;overflow:hidden;margin-top:6px}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;border-bottom:6px solid var(--g)}
h2,h3{margin:.2rem 0}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:10px 14px;color:#fff;background:var(--b);font-weight:700;min-height:48px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--y)}
.opts button{width:100%;margin:6px 0;font-size:1.25rem;background:var(--card);color:var(--ink);border:3px solid var(--b)}
.opts .ok{background:var(--g);color:#fff;border-color:var(--g)}.opts .no{background:var(--r);color:#fff;border-color:var(--r)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;padding:12px 6px}
.tile i{font-size:2rem;font-style:normal;line-height:1.3}
.tile:nth-child(4n+2){background:var(--r)}.tile:nth-child(4n+3){background:var(--g)}.tile:nth-child(4n+4){background:var(--p)}
.tile:disabled{opacity:.45}
select,input,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid #8aa;margin:3px 0;background:var(--card);color:var(--ink)}
.big{font-size:2rem;font-weight:900;text-align:center;margin:8px 0}
.lab{text-align:center;margin:0}
.tag{font-size:.75rem;background:var(--y);color:#333;border-radius:10px;padding:2px 8px}
.bar{height:14px;background:#0002;border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:var(--y)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{font-size:1.05rem;min-height:72px}.mc.up{background:var(--y);color:#222}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>button{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:right}
#fb{margin-top:8px;text-align:center;font-weight:700}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.96)}}
.hd h1{font-size:1.9rem}
.hd .sun{display:none}
h1,h2,h3,.tile{font-family:Lalezar,Vazirmatn,Tahoma,sans-serif;font-weight:400;letter-spacing:0}
.hd{isolation:isolate;overflow:hidden}html,body{overflow-x:hidden}.hd h1{font-size:2.1rem;text-shadow:0 3px 0 #1d3557}
button{border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.28);position:relative;top:0}
button:active{top:4px;box-shadow:0 1px 0 rgba(0,0,0,.28)}
.card{border-radius:30px}
main>.card:nth-of-type(3n+2){border-bottom-color:var(--b)}main>.card:nth-of-type(3n){border-bottom-color:var(--r)}
.tile{border-radius:28px;font-size:1.25rem;line-height:1.3;padding:14px 6px 10px}
.tile i{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#fff;font-size:2.2rem;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14);margin-bottom:4px}
.tile:nth-child(odd){transform:rotate(-1.2deg)}.tile:nth-child(even){transform:rotate(1.2deg)}
.tile small{display:block}.sf{color:#ffd23f;text-shadow:0 1px 0 #a67c00;font-size:1.4rem}.se{color:#fff6;font-size:1.4rem}
.opts button{border-radius:24px}.opts button:nth-child(4n+2){border-color:var(--r)}.opts button:nth-child(4n+3){border-color:var(--g)}.opts button:nth-child(4n){border-color:var(--p)}
.bar{height:20px;border-radius:12px}.bar b{background:linear-gradient(90deg,#ff6b6b,#ffd23f,#4cbf56,#2563eb);border-radius:12px}
.mc{border-radius:20px;background:linear-gradient(135deg,#7c3aed,#2563eb)}.mc:not(.up){font-size:2.2rem}
.own{font-size:2.4rem;display:inline-block;vertical-align:middle}#fb{font-size:1.25rem}.opts button.ok{border-color:var(--g)}.opts button.no{border-color:var(--r)}
.card h4{margin:14px 0 4px;color:var(--b);font-size:1.05rem}
.wg,.wb{display:inline-block;margin:3px;padding:3px 10px;border-radius:12px;color:#fff;font-size:1.15rem}.wg{background:var(--g)}.wb{background:var(--r)}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:50;padding:16px}.bx{background:var(--card);border-radius:24px;padding:16px;max-width:420px;width:100%}
.ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:420px;background:#1d3557;color:#fff;border-radius:18px;padding:12px 16px;text-align:center;z-index:60;font-weight:700}
.cr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.92rem}.cr>span:first-child{flex:0 0 8em}.cr>span:last-child{flex:0 0 auto;white-space:nowrap}
.cb{height:16px;background:#8883;border-radius:10px;overflow:hidden;flex:1}.cb b{display:block;height:100%;border-radius:10px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kp div{background:var(--bg);border-radius:18px;padding:8px;text-align:center;font-size:.9rem}.kp b{display:block;font-size:1.5rem}
.dn{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto}.dn::before{content:'';position:absolute;inset:15px;border-radius:50%;background:var(--card)}.dn span{position:relative;font-weight:900}
.tr{display:flex;align-items:flex-end;gap:4px;height:80px;border-bottom:2px solid #8886}.tr i{flex:1;min-width:6px;border-radius:6px 6px 0 0}
details{margin:6px 0;background:var(--bg);border-radius:18px;padding:8px 10px}summary{cursor:pointer;min-height:36px}
@media(prefers-reduced-motion:no-preference){.hd::before,.hd::after{position:absolute;top:10px;left:0;z-index:-1;pointer-events:none;font-size:2rem;animation:dr 24s linear infinite}.hd::before{content:"☁️"}.hd::after{content:"🎈";top:60px;animation-duration:30s;animation-delay:-12s}#fb,.mc.up,.big{animation:pop .4s}.own{animation:wg 2s ease-in-out infinite}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}}@keyframes wg{50%{transform:rotate(-12deg)}}}
.hero{position:relative;height:170px;overflow:hidden;border-radius:26px;background:linear-gradient(#5db8ff,var(--bg) 68%,var(--gr) 68%);margin-bottom:12px}
.hero .cl{position:absolute;font-size:2.6rem}
.hero .sn{position:absolute;top:8px;inset-inline-start:14px;font-size:2.6rem}
.hero .mas{position:absolute;bottom:4px;inset-inline-start:50%;margin-inline-start:-34px;font-size:4.2rem;line-height:1}
.hero .bub{position:absolute;top:14px;inset-inline-end:10px;max-width:46%;background:#fff;color:#1d3557;border-radius:18px;padding:6px 12px;font-weight:700;font-size:.95rem;line-height:1.5}
.hero .gd{position:absolute;bottom:6px;font-size:1.8rem}
.lg input{font-size:1.2rem;padding:14px;border-radius:16px;border-color:var(--b)}
.lg>button{font-size:1.3rem;background:var(--g);margin-top:6px}
@media(prefers-reduced-motion:no-preference){.hero .cl{animation:dr 16s linear infinite}.hero .mas{animation:bn 1.4s ease-in-out infinite}@keyframes dr{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}@keyframes bn{50%{transform:translateY(-12px)}}}
.pbtn{flex:1;position:relative;overflow:hidden;text-align:center;cursor:pointer;background:var(--p);color:#fff;border-radius:22px;padding:12px 8px;font-weight:700;min-height:48px;box-shadow:0 5px 0 rgba(0,0,0,.28)}.pbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
body{background:radial-gradient(circle at 12% 18%,#fff9 0 14px,#0000 15px),radial-gradient(circle at 84% 30%,#ffd23f66 0 20px,#0000 21px),radial-gradient(circle at 28% 76%,#ff8fab66 0 18px,#0000 19px),radial-gradient(circle at 90% 88%,#fff9 0 12px,#0000 13px),var(--bg);background-attachment:fixed}
.hd::after{content:"";display:block;height:10px;margin-top:8px;border-radius:6px;background:repeating-linear-gradient(90deg,#ff6b6b 0 25%,#ffd23f 0 50%,#4cbf56 0 75%,#2563eb 0)}
.card{box-shadow:0 6px 0 rgba(0,0,0,.07)}
.tile{background:linear-gradient(160deg,#5b9bff,#2563eb);border:4px solid #fff}
.tile:nth-child(6n+2){background:linear-gradient(160deg,#ff8a95,#e63946)}.tile:nth-child(6n+3){background:linear-gradient(160deg,#5fd36d,#2f9e44)}.tile:nth-child(6n+4){background:linear-gradient(160deg,#a78bfa,#7c3aed)}.tile:nth-child(6n+5){background:linear-gradient(160deg,#fb923c,#ea580c)}.tile:nth-child(6n+6){background:linear-gradient(160deg,#2dd4bf,#0d9488)}
.tile i{width:80px;height:80px;font-size:3rem;border:4px solid #fff;background:radial-gradient(circle at 30% 25%,#fff,#fff3c4)}
@media(prefers-reduced-motion:no-preference){.tile i{animation:bn 2.6s ease-in-out infinite}.tile:nth-child(2n) i{animation-delay:-1.3s}.tile:active i{animation:wg .45s}@keyframes bn{50%{transform:translateY(-6px) rotate(5deg)}}@keyframes wg{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}}
